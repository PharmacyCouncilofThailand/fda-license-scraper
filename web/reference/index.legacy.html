<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ค้นหาร้านยา — ตรวจสอบการอนุญาต อย.</title>
    <link rel="icon" href="./logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    />
    <link rel="stylesheet" href="./theme.css" />
    <style>
      /* Page-specific only — palette, glass and controls live in theme.css. */
      .wrap { max-width: 980px; margin: 0 auto; }
      h1 { font-size: 24px; font-weight: 500; margin: 0 0 4px; }
      .sub { color: var(--muted-foreground); font-size: 14px; margin: 0 0 20px; }

      form {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        border-radius: 1rem;
        padding: 14px;
      }
      input[type="text"] { flex: 1 1 240px; min-width: 0; }
      select { flex: 1 1 170px; min-width: 0; }
      select:disabled { opacity: 0.55; }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        width: 100%;
        border-top: 1px solid var(--border);
        padding-top: 12px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin: 18px 0 10px;
        font-size: 14px;
        color: var(--muted-foreground);
      }
      .toolbar strong { color: var(--foreground); font-weight: 500; }
      .badge {
        background: var(--success-bg);
        color: var(--success-fg);
        border-radius: 999px;
        padding: 3px 11px;
        font-size: 12.5px;
      }
      .link-btn {
        background: none;
        border: 0;
        padding: 0;
        color: var(--primary);
        font: inherit;
        font-size: 13px;
        text-decoration: underline;
        cursor: pointer;
      }
      .warn {
        margin: 0 0 10px;
        padding: 11px 14px;
        border-radius: .75rem;
        border: 1px solid var(--warning-line);
        background: var(--warning-bg);
        color: var(--warning-fg);
        font-size: 13.5px;
      }
      .error {
        margin: 18px 0 10px;
        padding: 12px 15px;
        border-radius: .75rem;
        background: var(--danger-bg);
        color: var(--danger-fg);
        font-size: 14px;
      }

      ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
      li {
        border-radius: min(1.5rem, 24px);
        padding: 16px 18px;
        cursor: pointer;
      }
      li.selected {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 35%, transparent),
          var(--glass-shadow);
      }
      .card-head { display: flex; align-items: flex-start; gap: 11px; }
      .card-head input[type="radio"] {
        margin: 3px 0 0;
        width: 18px;
        height: 18px;
        accent-color: var(--primary);
        cursor: pointer;
        flex: none;
      }
      .name { font-weight: 500; font-size: 16px; }

      /* The chosen shop, kept in view while the officer scrolls the results. */
      .pickbar {
        position: sticky;
        bottom: 16px;
        z-index: 20;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-top: 16px;
        padding: 13px 16px;
        border-radius: 1rem;
        font-size: 14px;
      }
      .pickbar .who { min-width: 0; }
      .pickbar .who b { font-weight: 500; display: block; }
      .pickbar .who small { color: var(--muted-foreground); }
      .pickbar .primary { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
      .addr { color: var(--muted-foreground); font-size: 14px; margin: 6px 0 12px; }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        font-size: 13px;
      }
      .tag {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 3px 11px;
        color: var(--muted-foreground);
      }
      .tag.on { background: var(--success-bg); color: var(--success-fg); border-color: transparent; }
      .tag.off { background: var(--danger-bg); color: var(--danger-fg); border-color: transparent; }
      .actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }

      /* .ghost is what the result cards already ask for — the design
         system's outline button, at the small size. */
      .ghost {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 6px 14px;
        font-size: 13px;
        color: var(--foreground);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 1rem;
        cursor: pointer;
        transition: border-color .15s, color .15s, transform .05s;
      }
      .ghost:hover { border-color: var(--primary); color: var(--primary); }
      .ghost:active { transform: translateY(1px); }
      .ghost:disabled { opacity: .55; cursor: progress; }
      a.detail { color: var(--primary); font-weight: 500; text-decoration: none; font-size: 13px; }
      a.detail:hover { text-decoration: underline; }

      .primary {
        padding: 11px 22px;
        font-weight: 500;
        color: var(--primary-foreground);
        background: var(--primary);
        border: 0;
        border-radius: 1rem;
        cursor: pointer;
        transition: transform .05s;
      }
      .primary:active { transform: translateY(1px); }
      .primary:disabled { opacity: 0.55; cursor: progress; }

      .preview {
        margin-top: 14px;
        padding: 13px 15px;
        border-radius: .75rem;
        background: var(--secondary);
        font-size: 14px;
      }
      .preview dl {
        margin: 0;
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 6px 14px;
      }
      .preview dt { color: var(--muted-foreground); }
      .preview dd { margin: 0; }
      .preview .empty { color: var(--muted-foreground); font-style: italic; }
      .map {
        margin-top: 12px;
        border: 1px solid var(--border);
        border-radius: .75rem;
        overflow: hidden;
      }
      .map iframe {
        display: block;
        width: 100%;
        height: 240px;
        border: 0;
      }
      .map-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 9px 11px;
        font-size: 13px;
        color: var(--muted-foreground);
        background: var(--card);
        border-top: 1px solid var(--border);
      }
      .no-map {
        margin-top: 12px;
        font-size: 13px;
        color: var(--muted-foreground);
      }

      @media (max-width: 560px) {
        .actions { margin-left: 0; width: 100%; }
        .preview dl { grid-template-columns: 1fr; gap: 2px; }
        .preview dt { margin-top: 6px; }
      }
    </style>
  </head>
  <body>
    <aside class="app-sidebar glass-panel-primary">
      <div class="brand">
        <span class="mark"><img src="./logo.png" alt="ตราสภาเภสัชกรรม" /></span>
        <span>
          <b>ตรวจร้านยา</b>
          <small>สภาเภสัชกรรม</small>
        </span>
      </div>
      <hr />
      <span class="group-label">เมนู</span>
      <nav>
        <a href="./index.html" aria-current="page">
          <span class="material-symbols-outlined sm fill">search</span>
          ค้นหาร้านยา
          <span class="dot"></span>
        </a>
        <a href="./form.html">
          <span class="material-symbols-outlined sm">description</span>
          บันทึกการตรวจ
          <span class="dot"></span>
        </a>
      </nav>
      <hr />
      <div class="foot">
        ข้อมูลจากระบบตรวจสอบการอนุญาต อย.<br />
      </div>
    </aside>

    <main class="app-main">
      <div class="wrap">
        <h1>ค้นหาร้านยา</h1>
        <p class="sub">
          ดึงข้อมูลสดจากระบบตรวจสอบการอนุญาตของ อย. แล้วกรองด้วยที่ตั้งก่อนแสดงผล
        </p>

        <form id="searchForm" class="glass-panel">
          <input
            id="keyword"
            type="text"
            placeholder="ชื่อร้านยา เช่น ฟาสซิโน"
            autocomplete="off"
            required
          />
          <button id="submitBtn" class="primary" type="submit">ค้นหา</button>

          <div class="filters">
            <select id="province" aria-label="จังหวัด">
              <option value="">ทุกจังหวัด</option>
            </select>
            <select id="district" aria-label="อำเภอ / เขต" disabled>
              <option value="">ทุกอำเภอ / เขต</option>
            </select>
            <select id="subdistrict" aria-label="ตำบล / แขวง" disabled>
              <option value="">ทุกตำบล / แขวง</option>
            </select>
          </div>
        </form>

        <div id="warn" class="warn" hidden></div>
        <div id="error" class="error" hidden></div>
        <div id="toolbar" class="toolbar"></div>
        <ul id="results"></ul>
        <div id="pickbar" class="pickbar glass-panel" hidden></div>
      </div>
    </main>

    <script>
      const form = document.getElementById('searchForm');
      const keywordInput = document.getElementById('keyword');
      const provinceSelect = document.getElementById('province');
      const districtSelect = document.getElementById('district');
      const subdistrictSelect = document.getElementById('subdistrict');
      const submitBtn = document.getElementById('submitBtn');
      const toolbar = document.getElementById('toolbar');
      const warnBox = document.getElementById('warn');
      const errorBox = document.getElementById('error');
      const list = document.getElementById('results');
      const pickbar = document.getElementById('pickbar');

      /** The shop the officer picked for the inspection form, if any. */
      let selected = null;

      // Served by the API itself, so a relative path is right. When the file is
      // opened directly (file://, a preview pane) there is no http base URL for
      // fetch to resolve against, so fall back to the local API origin.
      const API_BASE = location.protocol.startsWith('http')
        ? ''
        : 'http://localhost:3000';

      let areas = {}; // จังหวัด -> อำเภอ -> [ตำบล]
      let facets = null; // shop counts from the latest search, if any
      let lastResults = [];
      let pending = null;
      let forceRefresh = false;
      let lastKeyword = '';

      // ---------- area dropdowns ----------

      // Administrative data is static, so all three levels are selectable
      // before any search has run. Counts from the last search are layered on
      // top when available.
      fetch(`${API_BASE}/api/areas`)
        .then((r) => r.json())
        .then((d) => {
          areas = d.areas || {};
          fillSelect(provinceSelect, Object.keys(areas), 'ทุกจังหวัด', 'provinces');
        })
        .catch(() => showError('โหลดรายชื่อจังหวัดไม่สำเร็จ'));

      provinceSelect.addEventListener('change', () => {
        refillDistricts();
        refillSubdistricts();
        if (lastKeyword) form.requestSubmit();
      });

      districtSelect.addEventListener('change', () => {
        refillSubdistricts();
        if (lastKeyword) form.requestSubmit();
      });

      subdistrictSelect.addEventListener('change', () => {
        if (lastKeyword) form.requestSubmit();
      });

      function refillDistricts() {
        const inProvince = areas[provinceSelect.value];
        fillSelect(
          districtSelect,
          inProvince ? Object.keys(inProvince) : [],
          'ทุกอำเภอ / เขต',
          'districts'
        );
      }

      function refillSubdistricts() {
        const inProvince = areas[provinceSelect.value] || {};
        fillSelect(
          subdistrictSelect,
          inProvince[districtSelect.value] || [],
          'ทุกตำบล / แขวง',
          'subdistricts'
        );
      }

      /**
       * Rebuild a dropdown, keeping the current pick when it still exists and
       * appending "(n)" for areas that have shops in the latest result.
       */
      function fillSelect(select, names, placeholder, facetKey) {
        const counts = new Map(
          ((facets && facets[facetKey]) || []).map((f) => [f.name, f.count])
        );
        const current = select.value;
        select.innerHTML = '';
        select.append(new Option(placeholder, ''));
        for (const name of names) {
          const count = counts.get(name);
          select.append(new Option(count ? `${name} (${count})` : name, name));
        }
        select.value = names.includes(current) ? current : '';
        select.disabled = names.length === 0;
      }

      // ---------- search ----------

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const keyword = keywordInput.value.trim();
        if (!keyword) return;

        // Abandon an in-flight search when a new one starts.
        if (pending) pending.abort();
        pending = new AbortController();

        if (keyword !== lastKeyword) facets = null;
        lastKeyword = keyword;

        list.innerHTML = '';
        clearSelection();
        warnBox.hidden = true;
        errorBox.hidden = true;
        toolbar.textContent =
          'กำลังค้นหาจากเว็บ อย. อาจใช้เวลา 30–60 วินาที...';
        submitBtn.disabled = true;

        const query = new URLSearchParams({
          keyword,
          province: provinceSelect.value,
          district: districtSelect.value,
          subdistrict: subdistrictSelect.value,
          // The detail page is fetched per row on demand (preview / new tab),
          // so the slow per-row scrape is not wanted here.
          withDetails: 'false',
          refresh: forceRefresh ? 'true' : 'false',
        });

        try {
          const response = await fetch(
            `${API_BASE}/api/fda/drug-locations?${query}`,
            { signal: pending.signal }
          );
          const data = await response.json();
          if (!response.ok || !data.success) {
            throw new Error(data.message || 'ค้นหาไม่สำเร็จ');
          }
          render(data);
        } catch (err) {
          if (err.name === 'AbortError') return;
          toolbar.textContent = '';
          showError(
            API_BASE
              ? `ติดต่อ API ไม่ได้ (${err.message}) — สั่ง npm start แล้วเปิดหน้านี้ที่ ${API_BASE}`
              : err.message
          );
        } finally {
          submitBtn.disabled = false;
          forceRefresh = false;
          pending = null;
        }
      });

      function showError(message) {
        errorBox.hidden = false;
        errorBox.textContent = message;
      }

      function render(data) {
        facets = data.facets;
        lastResults = data.results;

        // Re-label the dropdowns with the counts this search produced.
        fillSelect(provinceSelect, Object.keys(areas), 'ทุกจังหวัด', 'provinces');
        refillDistricts();
        refillSubdistricts();

        renderToolbar(data);

        if (data.incomplete) {
          warnBox.hidden = false;
          warnBox.textContent =
            `คำค้นนี้กว้างเกินไป อ่านตารางได้ ${data.pagesRead} หน้าแล้วหยุดตามลิมิต ` +
            `ผลลัพธ์จึงยังไม่ครบทั้งหมด — ระบุชื่อร้านให้เจาะจงขึ้น หรือเพิ่มค่า MAX_PAGES`;
        }

        list.innerHTML = '';
        clearSelection();
        for (const row of data.results) list.append(card(row));
      }

      function renderToolbar(data) {
        toolbar.innerHTML = '';

        const area = [data.subdistrict, data.district, data.province]
          .filter(Boolean)
          .join(' · ');
        const summary = document.createElement('span');
        summary.innerHTML = area
          ? `กรองด้วย "${area}" เหลือ <strong>${data.totalMatched}</strong> ร้าน (จากทั้งหมด ${data.totalFound} รายการที่ค้นเจอ)`
          : `พบ <strong>${data.totalFound}</strong> รายการ (ไม่ได้กรองที่ตั้ง)`;
        toolbar.append(summary);

        if (!data.results.length) {
          toolbar.append(
            document.createTextNode(' — ไม่มีรายการที่ตรงกับเงื่อนไข')
          );
        }

        if (data.cached) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = `จากแคช · ${formatAge(data.cachedAgeSeconds)}`;
          toolbar.append(badge);

          const again = document.createElement('button');
          again.type = 'button';
          again.className = 'link-btn';
          again.textContent = 'ดึงข้อมูลใหม่';
          again.addEventListener('click', () => {
            forceRefresh = true;
            form.requestSubmit();
          });
          toolbar.append(again);
        }

        if (data.results.length) {
          const copyAll = document.createElement('button');
          copyAll.type = 'button';
          copyAll.className = 'ghost';
          copyAll.textContent = `คัดลอกทั้งหมด (${data.results.length})`;
          copyAll.addEventListener('click', () =>
            copy(copyAll, resultsAsTable())
          );
          toolbar.append(copyAll);
        }
      }

      // ---------- one result card ----------

      function card(row) {
        const item = document.createElement('li');
        item.className = 'glass-panel';

        const head = document.createElement('div');
        head.className = 'card-head';

        const pick = document.createElement('input');
        pick.type = 'radio';
        pick.name = 'pick';
        pick.setAttribute(
          'aria-label',
          `เลือก ${row.placeName || 'ร้านนี้'} เพื่อกรอกฟอร์ม`
        );
        pick.addEventListener('change', () => select(row, item));

        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = row.placeName || '(ไม่ระบุชื่อสถานที่)';
        head.append(pick, name);

        // Clicking anywhere on the card picks it — except on the controls,
        // which have their own jobs.
        item.addEventListener('click', (event) => {
          if (event.target.closest('button, a, input')) return;
          pick.checked = true;
          select(row, item);
        });

        const addr = document.createElement('div');
        addr.className = 'addr';
        addr.textContent = row.address || '-';

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.append(
          tag(row.licenseNo, ''),
          tag(row.licenseType, ''),
          tag(row.status, row.status === 'คงอยู่' ? 'on' : 'off')
        );

        const previewBox = document.createElement('div');
        previewBox.className = 'preview';
        previewBox.hidden = true;

        const actions = document.createElement('div');
        actions.className = 'actions';

        const previewBtn = document.createElement('button');
        previewBtn.type = 'button';
        previewBtn.className = 'ghost';
        previewBtn.textContent = 'พรีวิว';
        previewBtn.addEventListener('click', () =>
          togglePreview(row, previewBtn, previewBox)
        );
        actions.append(previewBtn);

        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'ghost';
        copyBtn.textContent = 'คัดลอก';
        copyBtn.addEventListener('click', () => copy(copyBtn, rowAsText(row)));
        actions.append(copyBtn);

        if (row.detailUrl) {
          const link = document.createElement('a');
          link.className = 'detail';
          link.href = row.detailUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = 'เปิดแท็บใหม่ ↗';
          actions.append(link);
        }

        meta.append(actions);
        item.append(head, addr, meta, previewBox);
        return item;
      }

      /** Mark one card as the chosen shop and show the action bar. */
      function select(row, item) {
        selected = row;
        for (const other of list.querySelectorAll('li.selected')) {
          other.classList.remove('selected');
        }
        item.classList.add('selected');
        renderPickbar();
      }

      function clearSelection() {
        selected = null;
        renderPickbar();
      }

      function renderPickbar() {
        pickbar.innerHTML = '';
        pickbar.hidden = !selected;
        if (!selected) return;

        const who = document.createElement('div');
        who.className = 'who';
        const title = document.createElement('b');
        title.textContent = selected.placeName || '(ไม่ระบุชื่อสถานที่)';
        const where = document.createElement('small');
        const area = selected.area || {};
        where.textContent =
          [area.subdistrict, area.district, area.province]
            .filter(Boolean)
            .join(' · ') || selected.licenseNo || '';
        who.append(title, where);

        const go = document.createElement('button');
        go.type = 'button';
        go.className = 'primary';
        go.textContent = 'กรอกฟอร์มการตรวจ';
        go.addEventListener('click', () => openForm(selected, go));

        pickbar.append(who, go);
      }

      /**
       * Hand one row to the inspection form. The licensee / operator / opening
       * hours live on the detail pop-up, so fetch it first unless the preview
       * already did — an empty ชื่อผู้รับอนุญาต is the one blank the officer
       * cannot fill from memory.
       */
      async function openForm(row, button) {
        const label = button.textContent;
        if (!row.detailLoaded && row.newCode) {
          button.disabled = true;
          button.textContent = 'กำลังดึงรายละเอียด...';
          try {
            const response = await fetch(
              `${API_BASE}/api/fda/detail?newCode=${encodeURIComponent(row.newCode)}`
            );
            const data = await response.json();
            if (response.ok && data.success) {
              row.licenseeName = data.licenseeName;
              row.operatorName = data.operatorName;
              row.openHours = data.openHours;
              row.detailLoaded = true;
            }
          } catch (err) {
            // The form is still usable without it; those blanks stay empty.
          } finally {
            button.disabled = false;
            button.textContent = label;
          }
        }
        localStorage.setItem('fda:form:pending', JSON.stringify(row));
        window.open('./form.html', '_blank', 'noopener');
      }

      /** Fetch the detail pop-up once, then show it inside the card. */
      async function togglePreview(row, button, box) {
        if (!box.hidden) {
          box.hidden = true;
          button.textContent = 'พรีวิว';
          return;
        }

        box.hidden = false;
        button.textContent = 'ซ่อน';
        if (box.dataset.loaded === 'true') return;

        box.textContent = 'กำลังโหลดรายละเอียด...';
        try {
          const response = await fetch(
            `${API_BASE}/api/fda/detail?newCode=${encodeURIComponent(row.newCode)}`
          );
          const data = await response.json();
          if (!response.ok || !data.success) {
            throw new Error(data.message || 'โหลดรายละเอียดไม่สำเร็จ');
          }
          row.licenseeName = data.licenseeName;
          row.operatorName = data.operatorName;
          row.openHours = data.openHours;
          row.lat = data.lat;
          row.lng = data.lng;

          box.dataset.loaded = 'true';
          box.innerHTML = '';
          box.append(
            definitions([
              ['ชื่อผู้รับอนุญาต', data.licenseeName],
              ['ผู้ดำเนินกิจการ', data.operatorName],
              ['เวลาเปิด - ปิด', data.openHours],
              ['เลขที่ใบอนุญาต', row.licenseNo],
              ['ที่อยู่', row.address],
            ])
          );

          box.append(mapPanel(row, data));

          const copyDetail = document.createElement('button');
          copyDetail.type = 'button';
          copyDetail.className = 'ghost';
          copyDetail.style.marginTop = '10px';
          copyDetail.textContent = 'คัดลอกรายละเอียด';
          copyDetail.addEventListener('click', () =>
            copy(copyDetail, rowAsText(row))
          );
          box.append(copyDetail);
        } catch (err) {
          box.textContent = err.message;
        }
      }

      /**
       * The FDA detail page carries the shop's coordinates in its "map" link.
       * When it has them, embed an OpenStreetMap view (no API key needed);
       * otherwise offer a Google Maps search on the address text instead.
       */
      function mapPanel(row, detail) {
        const googleQuery =
          detail.lat != null
            ? `${detail.lat},${detail.lng}`
            : `${row.placeName} ${row.address}`;
        const googleUrl =
          'https://www.google.com/maps/search/?api=1&query=' +
          encodeURIComponent(googleQuery);

        if (detail.lat == null) {
          const note = document.createElement('div');
          note.className = 'no-map';
          note.textContent = 'ระบบ อย. ไม่ได้ระบุพิกัดของร้านนี้ — ';
          note.append(externalLink(googleUrl, 'ค้นหาจากที่อยู่ใน Google Maps ↗'));
          return note;
        }

        const pad = 0.004;
        const bbox = [
          detail.lng - pad,
          detail.lat - pad,
          detail.lng + pad,
          detail.lat + pad,
        ].join(',');

        const panel = document.createElement('div');
        panel.className = 'map';

        const frame = document.createElement('iframe');
        frame.loading = 'lazy';
        frame.title = `แผนที่ ${row.placeName || ''}`.trim();
        frame.src =
          `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}` +
          `&layer=mapnik&marker=${detail.lat},${detail.lng}`;

        const bar = document.createElement('div');
        bar.className = 'map-bar';
        const coords = document.createElement('span');
        coords.textContent = `พิกัด ${detail.lat.toFixed(5)}, ${detail.lng.toFixed(5)}`;
        bar.append(
          coords,
          externalLink(googleUrl, 'เปิดใน Google Maps ↗'),
          externalLink(
            `https://www.openstreetmap.org/?mlat=${detail.lat}&mlon=${detail.lng}#map=17/${detail.lat}/${detail.lng}`,
            'เปิดใน OpenStreetMap ↗'
          )
        );

        panel.append(frame, bar);
        return panel;
      }

      function externalLink(href, text) {
        const link = document.createElement('a');
        link.className = 'detail';
        link.href = href;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = text;
        return link;
      }

      function definitions(pairs) {
        const dl = document.createElement('dl');
        for (const [label, value] of pairs) {
          const dt = document.createElement('dt');
          dt.textContent = label;
          const dd = document.createElement('dd');
          if (value) {
            dd.textContent = value;
          } else {
            dd.className = 'empty';
            dd.textContent = 'ไม่ระบุ';
          }
          dl.append(dt, dd);
        }
        return dl;
      }

      // ---------- helpers ----------

      function rowAsText(row) {
        return [
          row.placeName,
          `เลขที่ใบอนุญาต: ${row.licenseNo} (${row.licenseType})`,
          `สถานะ: ${row.status}`,
          row.licenseeName ? `ผู้รับอนุญาต: ${row.licenseeName}` : '',
          row.operatorName ? `ผู้ดำเนินกิจการ: ${row.operatorName}` : '',
          `ที่อยู่: ${row.address}`,
          row.lat != null ? `พิกัด: ${row.lat}, ${row.lng}` : '',
        ]
          .filter(Boolean)
          .join('\n');
      }

      /** Tab-separated, so it pastes straight into Excel or Google Sheets. */
      function resultsAsTable() {
        const header = [
          'ชื่อสถานที่',
          'เลขที่ใบอนุญาต',
          'ประเภท',
          'สถานะ',
          'ที่อยู่',
        ];
        const lines = lastResults.map((r) =>
          [
            r.placeName,
            r.licenseNo,
            r.licenseType,
            r.status,
            r.address,
          ].join('\t')
        );
        return [header.join('\t'), ...lines].join('\n');
      }

      async function copy(button, text) {
        const label = button.textContent;
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          // The clipboard API needs a secure context; fall back to a hidden field.
          const field = document.createElement('textarea');
          field.value = text;
          field.style.position = 'fixed';
          field.style.opacity = '0';
          document.body.append(field);
          field.select();
          document.execCommand('copy');
          field.remove();
        }
        button.textContent = 'คัดลอกแล้ว ✓';
        setTimeout(() => {
          button.textContent = label;
        }, 1500);
      }

      function formatAge(seconds) {
        if (!seconds || seconds < 60) return 'เมื่อสักครู่';
        const minutes = Math.round(seconds / 60);
        if (minutes < 60) return `${minutes} นาทีที่แล้ว`;
        return `${Math.round(minutes / 60)} ชั่วโมงที่แล้ว`;
      }

      function tag(text, extra) {
        const span = document.createElement('span');
        span.className = `tag ${extra}`.trim();
        span.textContent = text || '-';
        return span;
      }
    </script>
  </body>
</html>
