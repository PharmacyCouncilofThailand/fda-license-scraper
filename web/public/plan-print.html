<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <title>แผนการตรวจ</title>
    <style>
      /* Laid out after the office's own plan (แผนการตรวจ 27 สค 69.docx), the
         same as the Word export: TH SarabunPSK carried with the page so the
         PDF never falls back to whatever the server has, a 16pt title and date
         over a short rule, a 15pt bold heading row, 14pt cells centred
         vertically, landscape A4 with 2cm top/bottom and 1.6cm side margins.
         Chromium reads this @page rule, not page.pdf()'s margin option. */
      @font-face {
        font-family: 'TH SarabunPSK';
        src: url("./fonts/THSarabunPSK.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: 'TH SarabunPSK';
        src: url("./fonts/THSarabunPSK-Bold.ttf") format("truetype");
        font-weight: 700;
      }
      @page { size: A4 landscape; margin: 20mm 16mm; }
      body {
        margin: 0;
        background: #fff;
        font-family: 'TH SarabunPSK', sans-serif;
        font-size: 14pt;
        line-height: 1.15;
        color: #000;
      }
      h1 { font-size: 16pt; font-weight: 700; text-align: center; margin: 0; }
      .date { font-size: 16pt; text-align: center; margin: 0; }
      /* The short rule under the date: four of Word's 1.27cm default tabs. */
      .rule { width: 50.8mm; margin: 0 auto 32pt; border-bottom: 1px solid #000; height: 16pt; }
      /* Column widths in the original's own proportions (twips / 15304). */
      table { width: 100%; border-collapse: collapse; table-layout: fixed; }
      th, td {
        border: 1px solid #000;
        padding: 0 5pt;
        vertical-align: middle;
        text-align: left;
      }
      th { text-align: center; font-size: 15pt; font-weight: 700; height: 10mm; }
      th.licence { font-size: 14pt; }
      /* Repeat the heading on every printed page and never split a shop's row. */
      thead { display: table-header-group; }
      tr { break-inside: avoid; }
      .num { width: 5.27%; text-align: center; }
      td.num { font-weight: 700; }
      .place { width: 23.41%; }
      .licence { width: 10.19%; text-align: center; }
      .address { width: 22.23%; }
      .holder { width: 14.82%; text-align: center; }
      .pharmacists { width: 24.08%; text-align: center; }
      .line { display: block; }
    </style>
  </head>
  <body>
    <h1 id="title"></h1>
    <p class="date" id="date"></p>
    <div class="rule"></div>
    <table>
      <thead>
        <tr>
          <th class="num">ลำดับที่</th>
          <th class="place">ชื่อสถานที่</th>
          <th class="licence">ประเภทใบอนุญาต</th>
          <th class="address">สถานที่ตั้ง</th>
          <th class="holder">ผู้รับอนุญาต</th>
          <th class="pharmacists">ผู้มีหน้าที่ปฏิบัติการ</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <script>
      const THAI_MONTHS = [
        'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
        'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม',
      ];

      function thaiDate(date) {
        const [year, month, day] = String(date || '').split('-');
        const name = THAI_MONTHS[Number(month) - 1];
        return name ? `${Number(day)} ${name} ${year}` : String(date || '');
      }

      function degrees(value, positive, negative) {
        if (value == null || Number.isNaN(Number(value))) return '';
        const abs = Math.abs(Number(value));
        const d = Math.floor(abs);
        const m = Math.floor((abs - d) * 60);
        const s = ((abs - d) * 60 - m) * 60;
        return `${d}°${String(m).padStart(2, '0')}'${s.toFixed(1)}"${
          value >= 0 ? positive : negative
        }`;
      }

      /* A line is a string, or [bold, rest] for "คนที่ 1 : name". */
      function lines(parent, values) {
        for (const value of values) {
          if (!value) continue;
          const span = document.createElement('span');
          span.className = 'line';
          // textContent, never innerHTML: shop names carry quotes and angle
          // brackets straight from the FDA's data.
          if (Array.isArray(value)) {
            const strong = document.createElement('b');
            strong.textContent = value[0];
            span.append(strong, document.createTextNode(value[1]));
          } else {
            span.textContent = value;
          }
          parent.append(span);
        }
      }

      window.applyPlan = function applyPlan(plan) {
        document.getElementById('title').textContent = plan.title || '';
        document.getElementById('date').textContent = `วันที่ ${thaiDate(plan.date)}`;
        const body = document.getElementById('rows');
        body.textContent = '';
        for (const item of plan.items || []) {
          const tr = document.createElement('tr');
          const cells = ['num', 'place', 'licence', 'address', 'holder', 'pharmacists'].map(
            (name) => {
              const td = document.createElement('td');
              td.className = name;
              tr.append(td);
              return td;
            }
          );
          cells[0].textContent = item.order;
          const coords =
            item.lat == null || item.lng == null
              ? ''
              : `${degrees(item.lat, 'N', 'S')} ${degrees(item.lng, 'E', 'W')}`;
          lines(cells[1], [
            item.placeName,
            item.openHours ? `เวลาทำการ ${item.openHours}` : '',
            coords,
          ]);
          lines(cells[2], [item.licenseType, item.licenseNo]);
          lines(cells[3], [item.address]);
          lines(cells[4], [item.licenseeName]);
          const people = item.pharmacists || [];
          const out = [];
          people.forEach((person, i) => {
            out.push(people.length > 1 ? [`คนที่ ${i + 1}`, ` : ${person.name}`] : person.name);
            out.push(person.licenceNo ? `ภ. ${person.licenceNo}` : 'ภ.');
          });
          lines(cells[5], out);
          body.append(tr);
        }
      };
    </script>
  </body>
</html>
