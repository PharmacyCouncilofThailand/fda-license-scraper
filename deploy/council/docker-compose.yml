# The app on a machine inside the Pharmacy Council, with everything it keeps
# on the Council's NAS. Nothing here is reachable from outside the LAN, and
# the NAS is only ever reached from this machine over SMB.
#
#   cp .env.example .env    # then fill it in
#   docker compose up -d --build
#
# See README.md next to this file.
services:
  app:
    build:
      context: ../..
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:3000"
    environment:
      PLANS_STORE: file
      PLANS_DIR: /srv/app-data/plans
      RECORDS_DIR: /srv/app-data/records
      PHOTOS_DIR: /srv/app-data/photos
      DRIVE_DIR: /srv/drive
      PLANS_PASSCODE: ${PLANS_PASSCODE:?ตั้ง PLANS_PASSCODE ใน .env}
      FORM_TEMPLATE: /srv/templates/inspection-form.docx
    volumes:
      - app-data:/srv/app-data
      - drive:/srv/drive
      - ../../templates:/srv/templates:ro

# Two folders on the NAS: the drive (staff can browse it from Windows too) and
# the app's own plans, records and photos (which only the app should touch).
# uid/gid 1001 is the container's `app` user (see the Dockerfile).
volumes:
  drive:
    driver: local
    driver_opts:
      type: cifs
      device: "//${NAS_HOST:?ตั้ง NAS_HOST ใน .env}/${NAS_DRIVE_SHARE:?ตั้ง NAS_DRIVE_SHARE ใน .env}"
      o: "username=${NAS_USER},password=${NAS_PASSWORD},vers=${NAS_SMB_VERSION:-3.0},uid=1001,gid=1001,file_mode=0660,dir_mode=0770"
  app-data:
    driver: local
    driver_opts:
      type: cifs
      device: "//${NAS_HOST}/${NAS_APP_SHARE:?ตั้ง NAS_APP_SHARE ใน .env}"
      o: "username=${NAS_USER},password=${NAS_PASSWORD},vers=${NAS_SMB_VERSION:-3.0},uid=1001,gid=1001,file_mode=0660,dir_mode=0770"
